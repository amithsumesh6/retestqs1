<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
     
<div class="container mt-5">
<h2 class="text-center">Product Inventory</h2>
<h5>Total Products: <span id="total">0</span></h5>
<h5>Low Stock: <span id="low">0</span></h5>
<input type="text" id="id" class="form-control mb-2" placeholder="Product ID">
<input type="text" id="name" class="form-control mb-2" placeholder="Product Name">
<input type="number" id="price" class="form-control mb-2" placeholder="Price">
<input type="number" id="qty" class="form-control mb-2" placeholder="Quantity">
<button onclick="addProduct()" id="btn" class="btn btn-primary">Add Product</button>
<table class="table table-bordered mt-4 text-center">
<thead><tr><th>ID</th><th>Name</th><th>Price</th><th>Quantity</th><th>Action</th></tr></thead>
<tbody id="output"></tbody>
</table>
</div>
<script src="script.js"></script>
</body>
</html>
